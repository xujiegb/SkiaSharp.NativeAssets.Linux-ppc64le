name: build SkiaSharp.NativeAssets.Linux ppc64le

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SkiaSharp version, e.g. 3.119.4-preview.1.1"
        required: true
        default: "3.119.4-preview.1.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:13

    env:
      RID: linux-ppc64le
      SKIA_CPU: ppc64
      CC: powerpc64le-linux-gnu-gcc
      CXX: powerpc64le-linux-gnu-g++-wrap
      AR: powerpc64le-linux-gnu-ar
      STRIP: powerpc64le-linux-gnu-strip
      PKG_ID: SkiaSharp.NativeAssets.Linux
      FIXED_NUPKG_NAME: SkiaSharp.NativeAssets.Linux.ppc64le.nupkg
      DOTNET_ROOT: /root/.dotnet
      PATH: /root/.dotnet:/root/.dotnet/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Install build dependencies
        run: |
          set -eux

          dpkg --add-architecture ppc64el

          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            python3 \
            python3-pip \
            build-essential \
            clang \
            lld \
            ninja-build \
            cmake \
            pkg-config \
            gcc-powerpc64le-linux-gnu \
            g++-powerpc64le-linux-gnu \
            libc6-dev-ppc64el-cross \
            zip \
            unzip \
            file \
            binutils \
            findutils \
            tar \
            gzip \
            libicu-dev \
            libicu-dev:ppc64el \
            zlib1g-dev:ppc64el \
            libpng-dev:ppc64el \
            libfontconfig1-dev:ppc64el \
            libfreetype-dev:ppc64el \
            libharfbuzz-dev:ppc64el \
            libgl1-mesa-dev:ppc64el \
            libegl1-mesa-dev:ppc64el \
            libx11-dev:ppc64el \
            libxext-dev:ppc64el \
            libxrandr-dev:ppc64el \
            libxinerama-dev:ppc64el \
            libxcursor-dev:ppc64el \
            libxi-dev:ppc64el

          mkdir -p /usr/powerpc64le-linux-gnu/lib
          find /usr/lib/powerpc64le-linux-gnu /lib/powerpc64le-linux-gnu /usr/lib/powerpc64el-linux-gnu /lib/powerpc64el-linux-gnu /usr/lib/ppc64el-linux-gnu /lib/ppc64el-linux-gnu \
            -name 'lib*.so*' -exec ln -sf {} /usr/powerpc64le-linux-gnu/lib/ \; 2>/dev/null || true

          cat > /usr/local/bin/powerpc64le-linux-gnu-g++-wrap <<'EOF'
          #!/usr/bin/env bash
          set -e

          real_cxx=/usr/bin/powerpc64le-linux-gnu-g++

          is_skiasharp_link=0
          for arg in "$@"; do
            if [ "$arg" = "libSkiaSharp.so" ]; then
              is_skiasharp_link=1
              break
            fi
          done

          if [ "$is_skiasharp_link" = "1" ]; then
            new_args=()
            inserted=0

            for arg in "$@"; do
              if [ "$arg" = "-Wl,--end-group" ] && [ "$inserted" = "0" ]; then
                for round in 1 2 3; do
                  for lib in \
                    libicu.a \
                    obj/third_party/icu/libicu.a
                  do
                    if [ -f "$lib" ]; then
                      new_args+=("$lib")
                    fi
                  done
                done
                inserted=1
              fi

              new_args+=("$arg")
            done

            echo "=== wrapped libSkiaSharp.so link args probe ==="
            printf '%q\n' "${new_args[@]}" | grep -E 'libicu|libSkiaSharp|start-group|end-group' || true

            exec "$real_cxx" "${new_args[@]}"
          else
            exec "$real_cxx" "$@"
          fi
          EOF
          chmod +x /usr/local/bin/powerpc64le-linux-gnu-g++-wrap

          file /usr/powerpc64le-linux-gnu/lib/libfontconfig.so* || true
          file /usr/powerpc64le-linux-gnu/lib/libGLESv2.so* || true
          file /usr/powerpc64le-linux-gnu/lib/libEGL.so* || true
          file /usr/powerpc64le-linux-gnu/lib/libexpat.so* || true
          file /usr/powerpc64le-linux-gnu/lib/libharfbuzz.so* || true
          file /usr/powerpc64le-linux-gnu/lib/libharfbuzz-subset.so* || true
          file /usr/powerpc64le-linux-gnu/lib/libpng16.so* || true
          file /usr/powerpc64le-linux-gnu/lib/libicuuc.so* || true
          file /usr/powerpc64le-linux-gnu/lib/libicui18n.so* || true
          file /usr/powerpc64le-linux-gnu/lib/libicudata.so* || true

          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0.1xx --quality daily --install-dir "$DOTNET_ROOT"
          dotnet --info

      - name: Resolve SkiaSharp ref and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          GIT_REF="v${VERSION}"

          echo "git_ref=${GIT_REF}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "package_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Clone SkiaSharp
        run: |
          git clone --recursive --branch "${{ steps.meta.outputs.git_ref }}" \
            https://github.com/mono/SkiaSharp.git src

      - name: GN/Ninja cross build
        working-directory: src
        shell: bash
        run: |
          set -euxo pipefail

          GN_ARGS='
            is_debug=false
            is_official_build=true
            target_os="linux"
            target_cpu="ppc64"
            cc="powerpc64le-linux-gnu-gcc"
            cxx="powerpc64le-linux-gnu-g++-wrap"
            ar="powerpc64le-linux-gnu-ar"
            skia_enable_tools=false
            skia_enable_gpu=true
            skia_use_vulkan=true
            skia_use_egl=true
            skia_use_x11=true
            skia_use_gl=true
            skia_use_fontconfig=true
            skia_use_freetype=true
            skia_use_system_freetype2=false
            skia_use_system_libjpeg_turbo=false
            skia_use_system_libpng=false
            skia_use_system_libwebp=false
            skia_use_system_zlib=false
            skia_use_system_icu=false
            extra_cflags=["-fPIC"]
            extra_cflags_cc=["-fPIC"]
            extra_ldflags=[
              "-L/usr/powerpc64le-linux-gnu/lib",
              "-Wl,-rpath-link,/usr/powerpc64le-linux-gnu/lib"
            ]
          '

          cd externals/skia
          python3 tools/git-sync-deps

          if [ ! -f third_party/externals/icu/scripts/make_data_assembly.py ]; then
            rm -rf third_party/externals/icu
            git clone --depth 1 https://chromium.googlesource.com/chromium/deps/icu.git third_party/externals/icu
          fi

          test -f third_party/externals/icu/scripts/make_data_assembly.py

          echo "=== source tree position ==="
          pwd
          echo "=== parent tree ==="
          ls -la ..
          ls -la ../.. || true

          echo "=== list SkiaSharp xamarin wrapper tree ==="
          find ../../src/xamarin ../src/xamarin src/xamarin \
            -maxdepth 5 -type f 2>/dev/null | sort || true

          echo "=== deep probe native C API implementation sources ==="
          find ../.. .. . \
            -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
            -print | sort | grep -E \
              '/src/c/|/include/c/|/native/|/binding/|sk_general|sk_imageinfo|sk_types|sk_colortype|SkiaApi|SkiaSharp' || true

          echo "=== grep exact required C API symbols in whole SkiaSharp checkout ==="
          grep -R \
            -e "sk_colortype_get_default_8888" \
            -e "sk_colortype_get_default_565" \
            -e "sk_imageinfo_new" \
            -n ../.. .. . 2>/dev/null || true

          echo "=== grep exact required C API symbols in native-looking sources only ==="
          find ../.. .. . \
            -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
            -print | sort | while read -r f; do
              if grep -qE 'sk_colortype_get_default_8888|sk_colortype_get_default_565|sk_imageinfo_new' "$f"; then
                echo "--- $f"
                grep -n -C 4 -E 'sk_colortype_get_default_8888|sk_colortype_get_default_565|sk_imageinfo_new' "$f" || true
              fi
            done

          echo "=== grep near symbols: colortype / imageinfo / SKImageInfo ==="
          grep -R \
            -e "colortype_get_default" \
            -e "sk_colortype" \
            -e "sk_imageinfo" \
            -e "SKImageInfo" \
            -n ../../src ../src src 2>/dev/null || true

          echo "=== grep wrapper exports/macros ==="
          grep -R \
            -e "SK_C_API" \
            -e "SK_API" \
            -e "SK_X_API" \
            -e "SKIA_C_PLUS_PLUS_BEGIN_GUARD" \
            -e "extern \"C\"" \
            -n ../../src/xamarin ../src/xamarin src/xamarin ../../src/c ../src/c src/c 2>/dev/null || true

          echo "=== grep wrapper BUILD/GNI files before patch ==="
          find ../.. .. . \
            -type f \( -name 'BUILD.gn' -o -name '*.gni' -o -name '*.gn' \) \
            -print | sort | while read -r f; do
              if grep -qE 'libSkiaSharp|sk_xamarin|sk_compatpaint|SkiaKeeper|src/xamarin|src/c|xamarin|sk_imageinfo|sk_colortype|colortype' "$f"; then
                echo "--- $f"
                grep -n -C 8 -E 'libSkiaSharp|sk_xamarin|sk_compatpaint|SkiaKeeper|src/xamarin|src/c|xamarin|sk_imageinfo|sk_colortype|colortype|sources = \[|shared_library|component' "$f" || true
              fi
            done

          python3 - <<'PY'
          from pathlib import Path

          def patch_skiasharp_c_api_sources():
              candidate_files = [
                  Path("BUILD.gn"),
              ]
              candidate_files += sorted(Path(".").rglob("BUILD.gn"))
              candidate_files += sorted(Path(".").rglob("*.gni"))

              required_symbols = [
                  "sk_colortype_get_default_8888",
                  "sk_imageinfo_new",
              ]

              optional_symbols = [
                  "sk_colortype_get_default_565",
              ]

              c_api_sources = []

              src_c_dirs = [
                  Path("src/c"),
                  Path("../../src/c"),
                  Path("../src/c"),
              ]

              def source_path_for(p):
                  if p.as_posix().startswith("../../"):
                      return p.relative_to(Path("../..")).as_posix()
                  if p.as_posix().startswith("../"):
                      return p.relative_to(Path("..")).as_posix()
                  return p.as_posix()

              def find_provider(sym):
                  for src_c_dir in src_c_dirs:
                      if not src_c_dir.exists():
                          continue

                      for p in sorted(src_c_dir.glob("*.cpp")):
                          text = p.read_text(errors="ignore")
                          if sym in text:
                              return source_path_for(p)

                  return None

              for sym in required_symbols:
                  src = find_provider(sym)
                  if src is None:
                      raise SystemExit(f"Could not find provider source for required symbol: {sym}")

                  if src not in c_api_sources:
                      c_api_sources.append(src)

                  print(f"symbol {sym} provider: {src}")

              for sym in optional_symbols:
                  src = find_provider(sym)
                  if src is None:
                      print(f"[WARN] optional symbol provider not found: {sym}")
                      continue

                  if src not in c_api_sources:
                      c_api_sources.append(src)

                  print(f"optional symbol {sym} provider: {src}")

              for extra in [
                  "src/c/sk_types.cpp",
                  "src/c/sk_structs.cpp",
              ]:
                  if Path(extra).exists() and extra not in c_api_sources:
                      c_api_sources.append(extra)

              print("SkiaSharp C API sources to inject:")
              for src in c_api_sources:
                  print("  " + src)

              markers = [
                  '"src/xamarin/SkiaKeeper.c"',
                  '"src/xamarin/sk_xamarin.cpp"',
                  '"src/xamarin/sk_managedstream.cpp"',
                  '"src/xamarin/sk_stream_managedstream.cpp"',
              ]

              for gn in candidate_files:
                  if not gn.exists():
                      continue

                  text = gn.read_text()

                  if "libSkiaSharp" not in text and "SkiaSharp" not in text and "src/xamarin" not in text:
                      continue

                  if all(src in text for src in c_api_sources):
                      print(f"SkiaSharp C API sources already present in {gn}")
                      return

                  for marker in markers:
                      marker_line = marker + ","
                      if marker_line not in text:
                          continue

                      additions = ""
                      for src in c_api_sources:
                          if src not in text:
                              additions += f'    "{src}",\n'

                      if additions:
                          text = text.replace(marker_line, marker_line + "\n" + additions, 1)
                          gn.write_text(text)
                          print(f"patched SkiaSharp shared library target with C API sources: {gn}")
                          return

                  if "sources = [" in text and "src/xamarin" in text:
                      insert_at = text.find("sources = [")
                      end = text.find("]", insert_at)
                      if end != -1:
                          block = text[insert_at:end]
                          if "src/xamarin" in block:
                              additions = ""
                              for src in c_api_sources:
                                  if src not in text:
                                      additions += f'    "{src}",\n'
                              if additions:
                                  text = text[:end] + additions + text[end:]
                                  gn.write_text(text)
                                  print(f"patched SkiaSharp sources block with C API sources: {gn}")
                                  return

              raise SystemExit("Could not patch SkiaSharp shared library target with src/c C API sources")

          patch_skiasharp_c_api_sources()

          gn_files = list(Path(".").rglob("BUILD.gn")) + list(Path(".").rglob("*.gni"))

          png_gn = Path("third_party/libpng/BUILD.gn")
          if png_gn.exists():
              lines = png_gn.read_text().splitlines()
              out = []
              patched = False
              already = any("filter_vsx_intrinsics.c" in line for line in lines)

              for line in lines:
                  out.append(line)
                  if not already and "pngrutil.c" in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      out.append(f'{indent}"//third_party/externals/libpng/powerpc/powerpc_init.c",')
                      out.append(f'{indent}"//third_party/externals/libpng/powerpc/filter_vsx_intrinsics.c",')
                      patched = True

              text = "\n".join(out) + "\n"

              if "PNG_POWERPC_VSX_OPT=2" not in text:
                  text = text.replace(
                      "defines = [",
                      'defines = [\n    "PNG_POWERPC_VSX_OPT=2",',
                      1,
                  )

              png_gn.write_text(text)

              if patched:
                  print("patched bundled libpng powerpc vsx sources")
              elif already:
                  print("bundled libpng powerpc vsx sources already patched")
              else:
                  raise SystemExit("libpng pngrutil.c marker missing")
          else:
              raise SystemExit("third_party/libpng/BUILD.gn not found")

          needed_names = [
              "charstr.cpp",
              "charstrmap.cpp",
              "fixedstring.cpp",
              "lsr.cpp",
              "loclikelysubtags.cpp",
              "emojiprops.cpp",
              "lstmbe.cpp",
              "lstmdata.cpp",
              "uvector.cpp",
              "uvectr32.cpp",
              "unistr.cpp",
              "uniset.cpp",
              "uset.cpp",
              "uhash.cpp",
              "uresbund.cpp",
              "resbund.cpp",
              "udata.cpp",
              "utext.cpp",
              "umemory.cpp",
              "putil.cpp",
              "uobject.cpp",
              "locid.cpp",
              "locmap.cpp",
              "bytestream.cpp",
              "filteredbrk.cpp",
              "brkeng.cpp",
              "dictbe.cpp",
              "rbbi.cpp",
              "rbbidata.cpp",
              "rbbinode.cpp",
              "rbbirb.cpp",
              "rbbiscan.cpp",
              "rbbisetb.cpp",
              "rbbistbl.cpp",
              "rbbitblb.cpp",
              "rbbi_cache.cpp",
          ]

          common = Path("third_party/externals/icu/source/common")
          existing = []
          for name in needed_names:
              p = common / name
              if p.exists():
                  existing.append(f"//{p.as_posix()}")

          markers = [
              "loclikely.cpp",
              "uloc_keytype.cpp",
              "characterproperties.cpp",
              "brkeng.cpp",
          ]

          files = list(Path(".").rglob("BUILD.gn")) + list(Path(".").rglob("*.gni"))

          candidates = []
          for gn in files:
              try:
                  text = gn.read_text()
              except UnicodeDecodeError:
                  continue
              if any(m in text for m in markers):
                  candidates.append(gn)

          if not candidates:
              print("No direct BUILD.gn/.gni target containing ICU marker sources found.")
              raise SystemExit(1)

          patched = False

          for gn in candidates:
              text = gn.read_text()
              pos = 0

              while True:
                  insert_at = text.find("sources = [", pos)
                  if insert_at == -1:
                      break

                  end = text.find("]", insert_at)
                  if end == -1:
                      break

                  block = text[insert_at:end]
                  if any(m in block for m in markers):
                      additions = ""
                      for src in existing:
                          name = Path(src).name
                          if src not in text and name not in block:
                              additions += f'    "{src}",\n'

                      if additions:
                          text = text[:end] + additions + text[end:]
                          gn.write_text(text)
                          print(f"patched {gn}")
                          patched = True
                      else:
                          print(f"{gn} already contains requested ICU sources")
                          patched = True

                      break

                  pos = end + 1

              if patched:
                  break

          if not patched:
              print("Found candidate files, but no matching sources block was patched.")
              for gn in candidates:
                  print("candidate:", gn)
              raise SystemExit(1)
          PY

          echo "=== grep wrapper BUILD/GNI files after patch ==="
          find ../.. .. . \
            -type f \( -name 'BUILD.gn' -o -name '*.gni' -o -name '*.gn' \) \
            -print | sort | while read -r f; do
              if grep -qE 'libSkiaSharp|sk_xamarin|sk_compatpaint|SkiaKeeper|src/xamarin|src/c|xamarin|sk_imageinfo|sk_colortype|colortype' "$f"; then
                echo "--- $f"
                grep -n -C 8 -E 'libSkiaSharp|sk_xamarin|sk_compatpaint|SkiaKeeper|src/xamarin|src/c|xamarin|sk_imageinfo|sk_colortype|colortype|sources = \[|shared_library|component' "$f" || true
              fi
            done

          python3 bin/fetch-gn
          ./bin/gn gen ../../out/linux-ppc64le --args="$GN_ARGS"

          echo "=== generated ninja targets for SkiaSharp wrapper ==="
          ninja -C ../../out/linux-ppc64le -t targets all \
            | grep -E 'libSkiaSharp|sk_xamarin|sk_compatpaint|SkiaKeeper|xamarin|src/c|SkiaSharp|imageinfo|colortype' || true

          echo "=== generated ninja files: wrapper source references ==="
          grep -R \
            -e "sk_xamarin" \
            -e "sk_compatpaint" \
            -e "SkiaKeeper" \
            -e "src/xamarin" \
            -e "src/c" \
            -e "libSkiaSharp" \
            -e "sk_imageinfo" \
            -e "sk_colortype" \
            -e "colortype_get_default" \
            -n ../../out/linux-ppc64le 2>/dev/null || true

          echo "=== generated rsp files for libSkiaSharp / wrapper ==="
          find ../../out/linux-ppc64le -name '*.rsp' -print | sort | while read -r f; do
            if grep -qE 'sk_xamarin|sk_compatpaint|SkiaKeeper|src/xamarin|src/c|libSkiaSharp|sk_imageinfo|sk_colortype|colortype' "$f"; then
              echo "--- $f"
              tr ' ' '\n' < "$f" | grep -E 'sk_xamarin|sk_compatpaint|SkiaKeeper|src/xamarin|src/c|libSkiaSharp|sk_imageinfo|sk_colortype|colortype' || true
            fi
          done

          echo "=== generated build.ninja libSkiaSharp surrounding lines ==="
          grep -R -n "libSkiaSharp.so" ../../out/linux-ppc64le 2>/dev/null | head -n 80 || true

          echo "=== final build ==="
          ninja -C ../../out/linux-ppc64le -j1 -v

          echo "=== built libSkiaSharp.so candidates under out ==="
          find ../../out/linux-ppc64le -name 'libSkiaSharp.so' -type f -print | while read -r so; do
            echo "--- $so"
            file "$so" || true
            powerpc64le-linux-gnu-readelf -h "$so" || true
            echo "--- exported required / near symbols"
            powerpc64le-linux-gnu-nm -D "$so" 2>/dev/null \
              | grep -E 'sk_colortype_get_default_8888|sk_colortype_get_default_565|sk_imageinfo_new|sk_colortype|sk_imageinfo|SKImageInfo' || true
          done

          echo "=== post-build object provider probe for exact required C API symbols ==="
          find ../../out/linux-ppc64le/obj -name '*.o' -print | sort | while read -r o; do
            if powerpc64le-linux-gnu-nm -C --defined-only "$o" 2>/dev/null \
              | grep -qE 'sk_colortype_get_default_8888|sk_colortype_get_default_565|sk_imageinfo_new'; then
              echo "--- provider object: $o"
              powerpc64le-linux-gnu-nm -C --defined-only "$o" \
                | grep -E 'sk_colortype_get_default_8888|sk_colortype_get_default_565|sk_imageinfo_new' || true
            fi
          done

          echo "=== post-build object provider probe for near C API symbols ==="
          find ../../out/linux-ppc64le/obj -name '*.o' -print | sort | while read -r o; do
            if powerpc64le-linux-gnu-nm -C --defined-only "$o" 2>/dev/null \
              | grep -qE 'sk_colortype|sk_imageinfo|SKImageInfo|colortype_get_default'; then
              echo "--- near provider object: $o"
              powerpc64le-linux-gnu-nm -C --defined-only "$o" \
                | grep -E 'sk_colortype|sk_imageinfo|SKImageInfo|colortype_get_default' || true
            fi
          done

          echo "=== post-build unresolved probe for exact required C API symbols ==="
          find ../../out/linux-ppc64le/obj -name '*.o' -print | sort | while read -r o; do
            if powerpc64le-linux-gnu-nm -C -u "$o" 2>/dev/null \
              | grep -qE 'sk_colortype_get_default_8888|sk_colortype_get_default_565|sk_imageinfo_new'; then
              echo "--- undefined object: $o"
              powerpc64le-linux-gnu-nm -C -u "$o" \
                | grep -E 'sk_colortype_get_default_8888|sk_colortype_get_default_565|sk_imageinfo_new' || true
            fi
          done

      - name: Find libSkiaSharp.so
        id: findlib
        shell: bash
        run: |
          set -euo pipefail

          echo "==== candidate libSkiaSharp.so files ===="
          find src -name 'libSkiaSharp.so' -type f -print | sort | while read -r so; do
            echo "--- $so"
            file "$so" || true
            powerpc64le-linux-gnu-readelf -h "$so" || true
            echo "--- exact required symbols"
            powerpc64le-linux-gnu-nm -D "$so" 2>/dev/null \
              | grep -E 'sk_colortype_get_default_8888|sk_colortype_get_default_565|sk_imageinfo_new' || true
            echo "--- near exported symbols"
            powerpc64le-linux-gnu-nm -D "$so" 2>/dev/null \
              | grep -E 'sk_colortype|sk_imageinfo|SKImageInfo|colortype_get_default' || true
          done

          LIB="$(
            find src -name 'libSkiaSharp.so' -type f -print | sort | while read -r so; do
              if powerpc64le-linux-gnu-nm -D "$so" 2>/dev/null | grep -q 'sk_colortype_get_default_8888' &&
                 powerpc64le-linux-gnu-nm -D "$so" 2>/dev/null | grep -q 'sk_imageinfo_new'; then
                echo "$so"
                break
              fi
            done
          )"

          if [[ -z "$LIB" ]]; then
            echo "No valid libSkiaSharp.so exports required SkiaSharp C API symbols."
            echo "Required:"
            echo "  sk_colortype_get_default_8888"
            echo "  sk_imageinfo_new"
            echo "Optional:"
            echo "  sk_colortype_get_default_565"
            echo ""
            echo "==== final diagnostic: source contains exact required symbols? ===="
            grep -R \
              -e "sk_colortype_get_default_8888" \
              -e "sk_colortype_get_default_565" \
              -e "sk_imageinfo_new" \
              -n src 2>/dev/null || true
            echo ""
            echo "==== final diagnostic: native-looking source contains exact required symbols? ===="
            find src \
              -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
              -print | sort | while read -r f; do
                if grep -qE 'sk_colortype_get_default_8888|sk_colortype_get_default_565|sk_imageinfo_new' "$f"; then
                  echo "--- $f"
                  grep -n -C 4 -E 'sk_colortype_get_default_8888|sk_colortype_get_default_565|sk_imageinfo_new' "$f" || true
                fi
              done
            echo ""
            echo "==== final diagnostic: all exported sk_colortype/sk_imageinfo symbols from candidates ===="
            find src -name 'libSkiaSharp.so' -type f -print | sort | while read -r so; do
              echo "--- $so"
              powerpc64le-linux-gnu-nm -D "$so" 2>/dev/null \
                | grep -E 'sk_colortype|sk_imageinfo|SKImageInfo|colortype_get_default' || true
            done
            exit 1
          fi

          echo "Selected libSkiaSharp.so: $LIB"

          mkdir -p "pkg/runtimes/${RID}/native"
          cp "$LIB" "pkg/runtimes/${RID}/native/libSkiaSharp.so"

          file "pkg/runtimes/${RID}/native/libSkiaSharp.so"
          powerpc64le-linux-gnu-readelf -h "pkg/runtimes/${RID}/native/libSkiaSharp.so"

          echo "==== required symbol check ===="
          powerpc64le-linux-gnu-nm -D "pkg/runtimes/${RID}/native/libSkiaSharp.so" \
            | grep 'sk_colortype_get_default_8888'
          powerpc64le-linux-gnu-nm -D "pkg/runtimes/${RID}/native/libSkiaSharp.so" \
            | grep 'sk_imageinfo_new'

          echo "==== optional symbol check ===="
          powerpc64le-linux-gnu-nm -D "pkg/runtimes/${RID}/native/libSkiaSharp.so" \
            | grep 'sk_colortype_get_default_565' || true

          ${STRIP} "pkg/runtimes/${RID}/native/libSkiaSharp.so" || true

          echo "==== symbol check after strip ===="
          powerpc64le-linux-gnu-nm -D "pkg/runtimes/${RID}/native/libSkiaSharp.so" \
            | grep 'sk_colortype_get_default_8888'
          powerpc64le-linux-gnu-nm -D "pkg/runtimes/${RID}/native/libSkiaSharp.so" \
            | grep 'sk_imageinfo_new'

          echo "==== optional symbol check after strip ===="
          powerpc64le-linux-gnu-nm -D "pkg/runtimes/${RID}/native/libSkiaSharp.so" \
            | grep 'sk_colortype_get_default_565' || true

      - name: Create NuGet package project
        shell: bash
        run: |
          set -euo pipefail

          cat > pkg/${PKG_ID}.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net6.0</TargetFramework>
              <PackageId>${PKG_ID}</PackageId>
              <Version>${{ steps.meta.outputs.package_version }}</Version>
              <Authors>Repobot</Authors>
              <Company>${{ github.repository_owner }}</Company>
              <PackageLicenseExpression>MIT</PackageLicenseExpression>
              <PackageProjectUrl>https://github.com/mono/SkiaSharp</PackageProjectUrl>
              <Description>Unofficial SkiaSharp Linux native assets for linux-ppc64le, built from mono/SkiaSharp ${{ steps.meta.outputs.git_ref }}.</Description>
              <PackageTags>skiasharp skia native linux ppc64le powerpc</PackageTags>
              <RepositoryType>git</RepositoryType>
              <RepositoryUrl>https://github.com/mono/SkiaSharp</RepositoryUrl>
              <RepositoryCommit>$(cd src && git rev-parse HEAD)</RepositoryCommit>
              <IncludeBuildOutput>false</IncludeBuildOutput>
              <NoBuild>true</NoBuild>
            </PropertyGroup>

            <ItemGroup>
              <None Include="runtimes/linux-ppc64le/native/libSkiaSharp.so"
                    Pack="true"
                    PackagePath="runtimes/linux-ppc64le/native/libSkiaSharp.so" />
            </ItemGroup>
          </Project>
          EOF

          cd pkg
          dotnet pack ${PKG_ID}.csproj \
            --configuration Release \
            --output ../artifacts \
            --verbosity normal

          cd ..
          real_nupkg="$(find artifacts -maxdepth 1 -name "${PKG_ID}.*.nupkg" | head -n1)"
          test -n "$real_nupkg"

          cp -f "$real_nupkg" "artifacts/${FIXED_NUPKG_NAME}"

          echo "==== artifacts ===="
          ls -lh artifacts

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v6
        with:
          name: SkiaSharp.NativeAssets.Linux.ppc64le-${{ steps.meta.outputs.package_version }}
          path: artifacts/SkiaSharp.NativeAssets.Linux.ppc64le.nupkg

      - name: Upload nupkg to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: ${{ steps.meta.outputs.release_tag }}
          files: artifacts/SkiaSharp.NativeAssets.Linux.ppc64le.nupkg
          prerelease: true
          make_latest: false
